<style>
:root{
  --gold:#C8A96B;
  --black:#0B0B0B;
  --charcoal:#121212;
  --cream:#F8F5EE;
  --soft:#EAE3D5;
  --wine:#3A1F1A;
  --text:#D9C8A9;
  --white:#ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--black);
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  overflow-x:hidden;
  line-height:1.6;
}

/* NAV */
nav{
  position:fixed;
  top:0;left:0;right:0;
  z-index:999;
  backdrop-filter:blur(14px);
  background:rgba(11,11,11,.85);
  border-bottom:1px solid rgba(200,169,107,.12);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1.2rem 4rem;
}

.nav-logo{
  font-family:'Abril Fatface',serif;
  font-size:1.7rem;
  color:var(--gold);
  letter-spacing:1px;
}

.nav-links{
  display:flex;
  list-style:none;
  gap:2rem;
}

.nav-links a{
  color:rgba(255,255,255,.72);
  text-decoration:none;
  font-size:.82rem;
  text-transform:uppercase;
  letter-spacing:.15em;
  transition:.3s;
}

.nav-links a:hover{
  color:var(--gold);
}

.nav-tel{
  border:1px solid var(--gold);
  color:var(--gold)!important;
  padding:.7rem 1.4rem;
  border-radius:999px;
  font-weight:600;
}

.nav-tel:hover{
  background:var(--gold);
  color:var(--black)!important;
}

/* HERO */
.hero{
  min-height:100vh;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  padding:8rem 5rem 4rem;
  background:
  linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
  radial-gradient(circle at top right, rgba(200,169,107,.15), transparent 45%);
}

.hero-badge{
  display:inline-block;
  border:1px solid rgba(200,169,107,.4);
  color:var(--gold);
  padding:.5rem 1.1rem;
  border-radius:999px;
  font-size:.72rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:1.5rem;
}

.hero h1{
  font-family:'Abril Fatface',serif;
  font-size:clamp(4rem,8vw,7rem);
  line-height:.95;
  margin-bottom:1rem;
}

.hero h1 span{
  color:var(--gold);
}

.hero-sub{
  max-width:520px;
  color:rgba(255,255,255,.65);
  font-size:1.05rem;
  margin-bottom:2rem;
}

.hero-info{
  display:flex;
  gap:2rem;
  flex-wrap:wrap;
  margin-bottom:2rem;
}

.hero-info-item{
  color:rgba(255,255,255,.7);
}

.hero-info-item strong{
  color:var(--gold);
}

.hero-btns{
  display:flex;
  gap:1rem;
}

.btn-primary{
  background:var(--gold);
  color:var(--black);
  padding:1rem 2rem;
  border-radius:999px;
  text-decoration:none;
  font-weight:700;
  transition:.3s;
}

.btn-primary:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(200,169,107,.25);
}

.btn-outline{
  border:1px solid rgba(255,255,255,.2);
  color:#fff;
  padding:1rem 2rem;
  border-radius:999px;
  text-decoration:none;
}

.btn-outline:hover{
  border-color:var(--gold);
  color:var(--gold);
}

.hero-emoji{
  font-size:11rem;
  filter:drop-shadow(0 20px 40px rgba(200,169,107,.2));
}

.hero-pill{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  color:rgba(255,255,255,.8);
}

/* BANNER */
.banner{
  background:linear-gradient(90deg,#171717,#0b0b0b,#171717);
  border-top:1px solid rgba(200,169,107,.1);
  border-bottom:1px solid rgba(200,169,107,.1);
  padding:1.4rem 3rem;
}

.banner-text{
  color:rgba(255,255,255,.75);
}

.banner-text strong,
.banner-tel{
  color:var(--gold);
  font-family:'Abril Fatface',serif;
}

/* Sections */
section{
  padding:6rem 4rem;
}

.section-label{
  color:var(--gold);
  font-size:.75rem;
  text-transform:uppercase;
  letter-spacing:.25em;
  margin-bottom:.7rem;
}

.section-title{
  font-family:'Abril Fatface',serif;
  font-size:clamp(2.2rem,4vw,4rem);
  margin-bottom:3rem;
}

/* cards */
.formules,
.menu-section,
.suppl-section{
  background:var(--black);
}

.formule-card,
.prod-card,
.suppl-item,
.couscous-card{
  background:linear-gradient(180deg,#171717,#111);
  border:1px solid rgba(200,169,107,.12);
  border-radius:22px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
}

.formule-card:hover,
.prod-card:hover,
.couscous-card:hover{
  transform:translateY(-6px);
  border-color:rgba(200,169,107,.35);
}

.formule-name,
.prod-name,
.couscous-name{
  font-family:'Abril Fatface',serif;
  color:var(--white);
}

.formule-desc,
.prod-desc,
.couscous-sub{
  color:rgba(255,255,255,.55);
}

.prod-top{
  background:linear-gradient(135deg,#1d1d1d,#111);
}

.prod-price,
.suppl-price,
.couscous-price{
  color:var(--gold);
  font-family:'Abril Fatface',serif;
}

.prod-badge,
.formule-tag{
  background:var(--gold);
  color:var(--black);
}

.prod-badge.vege{
  background:#32492E;
  color:#DCE8D8;
}

/* tabs */
.tab{
  border:1px solid rgba(200,169,107,.18);
  color:rgba(255,255,255,.7);
  background:transparent;
}

.tab.active,.tab:hover{
  background:var(--gold);
  color:var(--black);
  border-color:var(--gold);
}

/* footer */
footer{
  background:#080808;
  border-top:1px solid rgba(200,169,107,.1);
  padding:4rem;
}

.footer-logo{
  color:var(--gold);
  font-family:'Abril Fatface',serif;
}

.footer-info,
.footer-links a{
  color:rgba(255,255,255,.55);
}

.footer-links a:hover{
  color:var(--gold);
}

/* animations */
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

.reveal{
  opacity:0;
  transform:translateY(30px);
  transition:all .8s ease;
}

.reveal.visible{
  opacity:1;
  transform:none;
}

/* responsive */
@media(max-width:768px){
  nav{padding:1rem 1.2rem;}
  .nav-links{display:none;}
  .hero{
    grid-template-columns:1fr;
    padding:7rem 1.5rem 3rem;
    text-align:center;
  }
  .hero-info,.hero-btns{
    justify-content:center;
  }
  .hero-visual{display:none;}
  section{padding:4rem 1.2rem;}
  footer{
    flex-direction:column;
    text-align:center;
    padding:2rem 1rem;
  }
}
</style>
